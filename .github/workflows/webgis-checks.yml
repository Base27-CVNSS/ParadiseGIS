name: WebGIS checks
on:
  pull_request:
    paths: ['webgis/**', 'scripts/**', 'tests/**', '.github/workflows/webgis-checks.yml']
  push:
    paths: ['webgis/**', 'scripts/**', 'tests/**', '.github/workflows/webgis-checks.yml']
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check webgis/app.js
      - run: node --test tests/core.test.cjs
      - run: python -W error::ResourceWarning -m unittest discover -s tests -p 'test_*.py'
